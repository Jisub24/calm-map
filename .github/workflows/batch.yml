# batch 예약 실행
#
# 예약(schedule)은 batch 스크립트가 완성된 뒤에 켠다.
# 지금 켜두면 10~15분마다 실패 알림 메일이 온다.
# 켤 때는 아래 schedule 의 주석(#)을 지우면 된다.
#
# cron 은 UTC 기준이다. 한국 시각은 +9시간.
#   "0 * * * *"      매시 정각 (혼잡도 수집)
#   "*/15 * * * *"   15분마다 (점수 계산 · 예측)

name: batch

on:
  workflow_dispatch: # Actions 탭에서 손으로 실행
  # schedule:
  #   - cron: "0 * * * *"

jobs:
  collect-congestion:
    name: 혼잡도 수집
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install -r batch/requirements.txt

      - name: 실행
        working-directory: batch
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collect_congestion.py
