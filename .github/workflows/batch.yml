# batch 예약 실행
#
# cron 은 UTC 기준이다. 한국 시각은 +9시간.
# 우리는 "몇 시에"가 아니라 "몇 시간마다"만 쓰므로 시간대와 무관하다.
#   "0 * * * *"      매시 정각 (혼잡도 수집)
#   "*/15 * * * *"   15분마다 (점수 계산 · 예측)
#
# 예약은 정확한 시각을 보장하지 않는다. GitHub 이 바쁘면 몇 분~수십 분 늦는다.
# 받은 시각은 congestion.base_at 에 남으므로 늦어도 기록은 정확하다.
#
# 새 작업을 추가할 때는 손으로(workflow_dispatch) 성공을 확인한 뒤 예약에 넣는다.
# 확인 없이 예약하면 실패할 때 매시간 알림이 와서, 진짜 고장도 묻힌다.

name: batch

on:
  workflow_dispatch: # Actions 탭에서 손으로 실행
  schedule:
    - cron: "0 * * * *" # 매시 정각 — 혼잡도 수집

jobs:
  collect-congestion:
    name: 혼잡도 수집
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install -r batch/requirements.txt

      - name: 실행
        working-directory: batch
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collect_congestion.py
