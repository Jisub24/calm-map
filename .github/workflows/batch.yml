# batch 예약 실행
#
# cron 은 UTC 기준이다. 한국 시각은 +9시간.
# 우리는 "몇 시에"가 아니라 "몇 분마다"만 쓰므로 시간대와 무관하다.
#   "17,37,57 * * * *"   매시 17 / 37 / 57 분 (혼잡도 수집)
#   "*/15 * * * *"       15분마다 (점수 계산 · 예측, 아직 안 씀)
#
# 예약은 정확한 시각을 보장하지 않는다. 부하가 몰리면 뒤로 밀리고 심하면 건너뛴다.
# 실제로 "0 * * * *"(매시 정각)으로 걸었더니 35시간 동안 7번만 돌았다 (이슈 #13).
# 정각은 전 세계 저장소가 몰리는 시각이라 더 밀린다.
#
# 그래서 두 가지를 같이 쓴다.
#   1) 정각을 피한다      17 / 37 / 57 분
#   2) 더 자주 예약한다    밀려도 1시간 안에 한 번은 돌게
#
# 20분마다가 과해 보이지만 밀리는 것을 감안하면 결과적으로 시간당 1~2번이다.
# congestion 에 unique (area_cd, target_at, is_forecast) 가 있어서
# 같은 시각을 또 받아도 덮어쓸 뿐 중복이 쌓이지 않는다.
#
# 받은 시각은 congestion.base_at 에 남으므로 늦게 돌아도 기록은 정확하다.
#
# 새 작업을 추가할 때는 손으로(workflow_dispatch) 성공을 확인한 뒤 예약에 넣는다.
# 확인 없이 예약하면 실패할 때마다 알림이 와서, 진짜 고장도 묻힌다.

name: batch

on:
  workflow_dispatch: # Actions 탭에서 손으로 실행
  schedule:
    - cron: "17,37,57 * * * *" # 20분마다 — 혼잡도 수집. 정각을 피한다

jobs:
  collect-congestion:
    name: 혼잡도 수집
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install -r batch/requirements.txt

      - name: 실행
        working-directory: batch
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collect_congestion.py
